name: Deploy to Vercel

# Automated deployment of OncoVault Web to Vercel.
# Builds the Flutter Web application in release mode and deploys the static
# artifacts to Vercel so the application can be accessed directly via URL.

on:
  push:
    branches:
      - main
      - 60percent
      - 60percent-update
      - feature/ci-cd-pipeline-deployment
      - dev
      - feature/ci-cd-pipeline
  # Allows triggering the deployment manually with 1-click from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  # ═════════════════════════════════════════════════════════════════════════════
  # 1. REQUIRED VERCEL SECRETS (Set these in GitHub Repo -> Settings -> Secrets)
  # ═════════════════════════════════════════════════════════════════════════════
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ═════════════════════════════════════════════════════════════════════════════
  # 2. BACKEND & BLOCKCHAIN GATEWAY CLOUD URLs (Configured in GitHub Secrets)
  # ═════════════════════════════════════════════════════════════════════════════
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  FABRIC_GATEWAY_URL: ${{ secrets.FABRIC_GATEWAY_URL }}

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (Release)
        run: |
          BUILD_ARGS=""
          if [ -n "${{ env.API_BASE_URL }}" ]; then
            echo "Injecting backend URL: ${{ env.API_BASE_URL }}"
            BUILD_ARGS="$BUILD_ARGS --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}"
          fi
          if [ -n "${{ env.FABRIC_GATEWAY_URL }}" ]; then
            echo "Injecting blockchain gateway URL: ${{ env.FABRIC_GATEWAY_URL }}"
            BUILD_ARGS="$BUILD_ARGS --dart-define=FABRIC_GATEWAY_URL=${{ env.FABRIC_GATEWAY_URL }}"
          fi
          echo "Building Flutter Web with flags: $BUILD_ARGS"
          flutter build web --release $BUILD_ARGS

      - name: Copy vercel.json into Web Build directory
        run: |
          # Ensures single-page app (SPA) rewrites are respected by Vercel
          cp vercel.json build/web/vercel.json || true

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./build/web

      - name: Summary & Live Link Output
        run: |
          echo "=========================================================="
          echo "🎉 Successfully deployed OncoVault Web to Vercel!"
          echo "🌐 Live Production URL: ${{ steps.vercel-deploy.outputs.preview-url }}"
          echo "=========================================================="
